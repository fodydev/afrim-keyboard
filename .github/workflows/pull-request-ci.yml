name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

env:
  CI_NAME: Pull Request CI
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cbindgen
        run: |
          cargo install cbindgen

      - name: Fetch build cache
        uses: actions/cache@v4
        id: build-cache
        with:
          path: "app/build"
          key: build

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Fetch submodules
        run: |
          git submodule update --init --recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # the legacy 'tools' package (default) no longer exists
          packages: platform-tools

      - name: Generate the C bindgen
        run: |
          make cbindgen

      - name: Build debug Afrim
        run: |
          make debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afrim-debug
          path: app/build/outputs/apk/debug/
          # keep 30 days
          retention-days: 30
