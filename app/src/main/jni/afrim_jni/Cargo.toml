[package]
name = "afrim_jni"
authors = ["Brady Fomegne <fomegnemeudje@outlook.com>"]
edition = "2021"
description = "A jni binding to the afrim library"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[features]
default = []
rhai = ["afrim-translator/rhai", "afrim-config/rhai"]

[dependencies]
afrim-config = { version = "0.4.8" }
afrim-preprocessor = { version = "0.7.0", features = ["serde"] }
afrim-translator = "0.2.4"
anyhow = "1.0.81"
indexmap = "2.2.3"
jni = "0.21.1"
once_cell = "1.19.0"
serde_json = "1.0.114"
