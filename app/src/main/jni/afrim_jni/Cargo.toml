[package]
name = "afrim_jni"
authors = ["Brady Fomegne <fomegnemeudje@outlook.com>"]
edition = "2021"
description = "A jni binding to the afrim library"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[features]
default = []
rhai = ["afrim-translator/rhai", "afrim-config/rhai"]

[dependencies]
afrim-config = { version = "0.4.8" }
afrim-preprocessor = { version = "0.7.1", features = ["serde"] }
afrim-translator = "0.2.5"
anyhow = "1.0.105"
indexmap = "2.14.2"
jni = "0.22.4"
once_cell = "1.21.4"
serde_json = "1.0.154"
